name: Lightweight Portfolio API
on:
  push:
    paths:
      - 'showcase/project_api.py'
      - 'showcase/server.py'
      - 'showcase/site.py'
      - 'showcase/tests/**'
      - '.github/workflows/project-api-tests.yml'
  pull_request:
    paths:
      - 'showcase/project_api.py'
      - 'showcase/server.py'
      - 'showcase/site.py'
      - 'showcase/tests/**'
      - '.github/workflows/project-api-tests.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install flask
      - run: python -m compileall -q showcase
      - run: python -m unittest discover -s showcase/tests -v
